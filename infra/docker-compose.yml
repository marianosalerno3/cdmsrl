# Stack di produzione — eseguire da infra/ :  docker compose up -d --build
#
#   caddy      edge TLS + reverse proxy; serve la SPA statica e inoltra a php-fpm
#   api        PHP-FPM (Laravel portale-api)
#   queue      worker delle code (stessa immagine di api)
#   scheduler  php artisan schedule:work (stessa immagine di api)
#   db         MariaDB
#   redis      cache + code

name: cdmsrl-portale

x-api-image: &api-image
  build:
    context: ..
    dockerfile: infra/api.Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: cdmsrl/portale-api:latest
  restart: unless-stopped
  env_file: .env
  environment:
    APP_URL: https://${API_DOMAIN}
    SPA_URL: https://${APP_DOMAIN}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    MAIL_MAILER: smtp
    SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN}
    FILAMENT_PATH: access
  volumes:
    - api-storage:/var/www/html/storage/app
    - api-logs:/var/www/html/storage/logs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
      args:
        API_DOMAIN: ${API_DOMAIN}
    image: cdmsrl/portale-edge:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    <<: *api-image
    # php-fpm su :9000, raggiunto solo da caddy nella rete interna

  queue:
    <<: *api-image
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - api

  scheduler:
    <<: *api-image
    command: php artisan schedule:work
    depends_on:
      - api

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data

volumes:
  caddy-data:
  caddy-config:
  api-storage:
  api-logs:
  db-data:
  redis-data:
